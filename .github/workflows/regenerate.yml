name: Regenerate from the published OpenAPI document

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The organization forbids Actions from opening pull requests
  # (0xinsider/0xinsider#22185), so a regeneration that cannot open one is
  # announced as an issue instead.
  issues: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Regenerate
        env:
          # Resolves APP_COMMIT, the 0xinsider/0xinsider commit that last changed
          # the document. That repository is private, so the default token cannot
          # read it and APP_COMMIT is recorded as null unless the optional
          # OXINSIDER_APP_READ_TOKEN secret (read-only contents on that
          # repository) is set. Never guessed.
          GH_TOKEN: ${{ secrets.OXINSIDER_APP_READ_TOKEN || github.token }}
        run: npm run generate
      # A pull request opened with the default token starts no CI run, so the
      # checks run here and their outcome goes into the pull request body.
      - name: Drift check
        id: drift
        continue-on-error: true
        run: npm run check
      - name: Build and test
        id: test
        continue-on-error: true
        run: npm test
      - name: Open a pull request when the document changed
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.drift.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          branch="regenerate/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: regenerate from the published OpenAPI document"
          git push --force origin "$branch"
          body="$(printf '%s\n' \
            "The document at https://0xinsider.com/api/v1/openapi.json changed. Generated by scripts/generate.mjs." \
            "" \
            "- npm run check: ${DRIFT}" \
            "- npm test: ${TEST}" \
            "" \
            "A failed check means the document gained or lost an operation, a query parameter or an Idempotency-Key route that src/client.ts does not follow yet: run npm run check locally, update the client, then bump package.json and publish a release.")"
          title="Regenerate from the published OpenAPI document"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body "$body"
          elif ! gh pr create --head "$branch" --title "$title" --body "$body"; then
            # gh printed the refusal above. Announce the pushed branch as an issue
            # so the regeneration is not lost; open the pull request from it by hand.
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}"
            issue_body="$(printf '%s\n' "$body" "" "Branch \`${branch}\`: ${compare}" "" "Actions cannot open pull requests in this organization (0xinsider/0xinsider#22185), so open one from that branch.")"
            existing="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$issue_body"
              echo "Updated issue #${existing}."
            else
              gh issue create --title "$title" --body "$issue_body"
            fi
          fi
