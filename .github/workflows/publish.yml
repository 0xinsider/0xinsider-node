name: Publish to npm

# Publishes @0xinsider/sdk to https://www.npmjs.com/package/@0xinsider/sdk
# through npm trusted publishing: no npm token is stored anywhere. The package's
# trusted publisher on npmjs.com names this repository, this workflow FILENAME
# (publish.yml) and the `npm` environment; renaming the file or the environment
# breaks publishing until that entry is updated to match. Because the repository
# is public, npm records a provenance attestation that links the published
# tarball to this workflow run.
#
# A published release runs it (the tag must be v<package.json version>); a
# manual dispatch with dry_run rehearses every step, including the real OIDC
# token exchange, and publishes nothing. A version already on npm is skipped,
# not failed.
#
# TWO JOBS, and the split is the security boundary. `build` installs, checks and
# packs WITHOUT `id-token`, then hands one tarball to `publish`, which holds
# `id-token: write`, never checks out or runs repository code, and checks the
# tarball's digest and manifest before it hands it a credential. Code that runs
# during `npm ci` or the build can therefore not mint the publish credential.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, pack and rehearse the publish, including the OIDC exchange. Publish nothing."
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # A release publishes its tag; a dispatch publishes the default branch only.
    if: >-
      github.repository == '0xinsider/0xinsider-node' &&
      (github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      published: ${{ steps.published.outputs.published }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      # Build and type-check the documented consumer example. The tarball
      # below packs this same dist/; release verification does not run tests.
      - run: npm run build
      - run: npm run check:examples

      # `npm pack` copies the manifest version verbatim while `npm publish`
      # normalizes it, so a non-canonical string (`v0.3.0`, `0.3.0+build`) would
      # pack one version and publish another. Build metadata is refused for the
      # same reason; a prerelease suffix is allowed.
      - name: Resolve the version and check the release tag
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          # shellcheck disable=SC2016 # single-quoted text below is JavaScript for node -e
          node -e '
            const v = process.argv[1];
            const canonical = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$/;
            if (!canonical.test(v)) {
              console.error(`::error::package.json version ${JSON.stringify(v)} is not canonical semver (no leading v, no leading zeros, no build metadata)`);
              process.exit(1);
            }
          ' "$version"
          if [ "$EVENT" = "release" ] && [ "$TAG" != "v${version}" ]; then
            echo "::error::release tag ${TAG} does not match package.json version ${version}; tag the release v${version}" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "will publish @0xinsider/sdk@${version}"

      # Only a genuine 404 means "not published". Any other registry answer
      # fails the run: reading a 5xx as absent would attempt a duplicate publish.
      - name: Check whether the version is already on npm
        id: published
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if out="$(npm view --prefer-online "@0xinsider/sdk@${VERSION}" version 2>&1)"; then
            if [ -n "$out" ]; then
              echo "::notice::@0xinsider/sdk@${VERSION} is already on npm; skipping the publish. Bump package.json for a new release."
              printf 'published=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            case "$out" in
              *E404*|*"is not in this registry"*|*"No match found"*) : ;;
              *)
                echo "::error::could not determine whether ${VERSION} is published; refusing to continue" >&2
                printf '%s\n' "$out" >&2
                exit 1
                ;;
            esac
          fi
          printf 'published=false\n' >> "$GITHUB_OUTPUT"
          echo "not yet published: ${VERSION}"

      # A real pack, not --dry-run: these bytes are what `publish` uploads. The
      # tarball must carry the entry point, its declarations, the generated
      # contract types and the provenance constants.
      - name: Pack and inspect
        id: pack
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # single-quoted text below is JavaScript for node -e
          filename="$(npm pack --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const report = JSON.parse(s);
              // npm 11 emits an array; npm 12 keys its report by package name.
              const packages = Array.isArray(report) ? report : Object.values(report);
              if (packages.length !== 1 || packages[0]?.name !== "@0xinsider/sdk") {
                console.error("pack report must describe exactly @0xinsider/sdk");
                process.exit(1);
              }
              const p = packages[0];
              const files = p.files.map((x) => x.path);
              const need = ["package.json", "README.md", "LICENSE", "dist/index.js", "dist/index.d.ts", "dist/schema.d.ts", "dist/provenance.js", "dist/provenance.d.ts"];
              const missing = need.filter((x) => !files.includes(x));
              if (missing.length) { console.error(`tarball is missing ${missing.join(", ")}`); process.exit(1); }
              console.error(`${files.length} files; ${need.join(", ")} present`);
              process.stdout.write(p.filename);
            });
          ')"
          test -f "$filename"
          mv -- "$filename" sdk-package.tgz
          digest="$(sha256sum sdk-package.tgz | cut -d' ' -f1)"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          echo "packed sdk-package.tgz sha256=${digest}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-tarball
          path: sdk-package.tgz
          if-no-files-found: error
          overwrite: true
          # Sized for "Re-run failed jobs" on `publish` after a registry lag.
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.repository == '0xinsider/0xinsider-node' &&
      (github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (needs.build.outputs.published != 'true' || inputs.dry_run)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # The only grant: the short-lived OIDC credential npm exchanges for
      # publish rights, and signs the provenance attestation with. No
      # `contents: read`; this job never checks out, and a same-run artifact
      # downloads with the Actions runtime token.
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later. Below it, npm silently
      # skips the OIDC exchange and the publish fails with an unexplained E401.
      - name: Require the npm version trusted publishing needs
        run: |
          set -euo pipefail
          version="$(npm --version)"
          lowest="$(printf '11.5.1\n%s\n' "$version" | sort -V | head -n1)"
          if [ "$lowest" != "11.5.1" ]; then
            echo "::error::npm ${version} is below the 11.5.1 floor trusted publishing needs" >&2
            exit 1
          fi
          echo "npm ${version}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-tarball

      - name: Verify the tarball is the one the build job packed
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256" || { echo "::error::the build job recorded no digest" >&2; exit 1; }
          actual="$(sha256sum sdk-package.tgz | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::tarball digest ${actual} does not match the build job's ${EXPECTED_SHA256}" >&2
            exit 1
          fi
          echo "tarball digest verified: ${actual}"

      # The digest proves the bytes arrived unchanged, not what they contain.
      # npm publish reads the manifest out of the tarball and flattens its
      # publishConfig into the run options, so a registry key there would send
      # this job's OIDC assertion to another host. Read the manifest the way npm
      # does (pacote: strip the first path component, drop link entries) and
      # allow only publishConfig.access.
      - name: Assert the tarball manifest before handing it a credential
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_VERSION" || { echo "::error::the build job recorded no version" >&2; exit 1; }
          # tar and grep statuses are read separately and without pipes: under
          # pipefail an early-exiting reader can turn a match into a SIGPIPE
          # status, and `|| true` would read a grep error as "clean".
          members="$(tar -tf sdk-package.tgz)"
          verbose="$(tar -tvf sdk-package.tgz)"
          # scan <grep flags> <pattern> <input>: the matching lines, or a failed
          # step when grep itself fails (status 2), never an empty "clean".
          scan() {
            local status=0 found
            found="$(grep "$1" -- "$2" <<<"$3")" || status=$?
            if [ "$status" -gt 1 ]; then
              echo "::error::could not scan the tarball (grep exited ${status})" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          outside="$(scan -Ev '^package/' "$members")"
          traversal="$(scan -E '(^|/)\.\.(/|$)' "$members")"
          links="$(scan -E '^[hl]' "$verbose")"
          if [ -n "$outside" ]; then
            echo "::error::tarball has members outside package/: ${outside}" >&2
            exit 1
          fi
          if [ -n "$traversal" ]; then
            echo "::error::tarball has a path-traversal member: ${traversal}" >&2
            exit 1
          fi
          if [ -n "$links" ]; then
            echo "::error::tarball carries link entries; npm drops them and would read a different manifest: ${links}" >&2
            exit 1
          fi
          rm -rf manifest-check && mkdir manifest-check
          tar --strip-components=1 --no-same-owner --no-same-permissions -xf sdk-package.tgz -C manifest-check
          if [ -L manifest-check/package.json ] || [ ! -f manifest-check/package.json ] || [ "$(stat -c '%h' manifest-check/package.json)" != "1" ]; then
            echo "::error::the tarball's package.json is missing or is not a single regular file" >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # single-quoted text below is JavaScript for node -e
          node -e '
            const m = require("./manifest-check/package.json");
            const fail = (msg) => { console.error(`::error::${msg}`); process.exit(1); };
            if (m.name !== "@0xinsider/sdk") fail(`tarball name is ${m.name}`);
            if (m.version !== process.env.EXPECTED_VERSION) fail(`tarball version ${m.version} is not ${process.env.EXPECTED_VERSION}`);
            const pc = m.publishConfig ?? {};
            if (typeof pc !== "object" || pc === null || Array.isArray(pc)) fail("tarball publishConfig is not an object");
            const extra = Object.keys(pc).filter((k) => k !== "access");
            if (extra.length) fail(`tarball publishConfig carries keys this workflow does not allow: ${extra.join(", ")}`);
            if ("access" in pc && pc.access !== "public") fail(`tarball publishConfig.access is ${pc.access}`);
            console.log(`manifest verified: ${m.name}@${m.version}`);
          '

      # "Re-run failed jobs" on this job after a publish that landed but whose
      # verification timed out must not fail on npm's duplicate refusal. The
      # check is on bytes: the registry's dist.integrity against this tarball.
      # Equal: already live, skip. Different: someone published other bytes
      # under this version; stop.
      - name: Skip a republish of bytes already on npm
        id: already
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          status=0
          published="$(npm view --prefer-online "@0xinsider/sdk@${VERSION}" dist.integrity 2>view-err.log)" || status=$?
          if [ "$status" -ne 0 ]; then
            case "$(cat view-err.log)" in
              *E404*|*"is not in this registry"*|*"No match found"*)
                printf 'state=absent\n' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "::error::could not determine whether ${VERSION} is published" >&2
                cat view-err.log >&2
                exit 1
                ;;
            esac
          fi
          published="$(printf '%s' "$published" | tr -d '[:space:]')"
          if [ -z "$published" ]; then
            printf 'state=absent\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ours="sha512-$(openssl dgst -sha512 -binary sdk-package.tgz | base64 | tr -d '\n')"
          if [ "$published" = "$ours" ]; then
            echo "${VERSION} is already on npm with these exact bytes; skipping"
            printf 'state=identical\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::@0xinsider/sdk@${VERSION} is on npm with different bytes (registry ${published}, ours ${ours})" >&2
          exit 1

      # Verbose because npm's OIDC helper never throws: a failed exchange logs
      # and returns, and the publish then dies on auth with no stated cause. In
      # a dry run nothing fails at all, so the grep below is what proves the
      # exchange happened.
      - name: Publish
        id: publish
        if: ${{ steps.already.outputs.state != 'identical' }}
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(publish ./sdk-package.tgz --access public --provenance --registry https://registry.npmjs.org/)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          set +o pipefail
          npm "${args[@]}" 2>&1 | tee publish-output.log
          status="${PIPESTATUS[0]}"
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            if grep -q 'Successfully retrieved and set token' publish-output.log; then
              echo "dry run: the npm OIDC token exchange succeeded"
            else
              echo "::error::dry run finished but npm never reported a successful OIDC token exchange: the trusted publisher is not registered for 0xinsider/0xinsider-node, publish.yml and the npm environment, or npm changed its log text" >&2
              exit 1
            fi
          fi

      - name: Surface npm's debug log when the publish fails
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir="$(npm config get logs-dir 2>/dev/null || true)"
          if [ "$dir" = "null" ] || [ -z "$dir" ]; then
            dir="$(npm config get cache 2>/dev/null || true)/_logs"
          fi
          for f in "$dir"/*-debug-*.log; do
            printf '::group::%s\n' "$f"
            grep -iE 'oidc|id-token|provenance|sigstore|permission|forbidden|ENEEDAUTH|E401|E403|EOTP' "$f" || echo "(no matching lines)"
            printf '::endgroup::\n'
          done

      - name: Verify the registry serves it
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # npm scans accepted uploads before they become installable, usually
          # around five minutes and sometimes fifteen or more. A 202 upload
          # response is not registry acceptance. Keep this wait bounded and
          # retain the same tarball for a later exact-byte retry.
          for attempt in $(seq 1 30); do
            if npm view --prefer-online "@0xinsider/sdk@${VERSION}" version >/dev/null 2>&1; then
              echo "published and visible: @0xinsider/sdk@${VERSION}"
              exit 0
            fi
            echo "registry does not serve ${VERSION} yet (${attempt}/30)"
            sleep 30
          done
          echo "::error::${VERSION} is not visible after 15 minutes. npm scanning may still be pending: check npm view, then use Re-run failed jobs on this run rather than a new dispatch." >&2
          exit 1
